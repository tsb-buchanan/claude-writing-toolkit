name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repo rules (dashes, SKILL.md size, copies in sync)
        run: python3 tools/check_repo.py
      - name: Unit tests
        run: python3 -m unittest discover tests
      - name: Build the zips and the web guide
        run: python3 tools/build_release.py
      - name: Keep the test build
        uses: actions/upload-artifact@v4
        with:
          name: writing-toolkit-test-build
          path: dist/
