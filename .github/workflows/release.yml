name: release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to attach the files to, such as v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repo rules
        run: python3 tools/check_repo.py
      - name: Unit tests
        run: python3 -m unittest discover tests
      - name: Build the zips and the web guide
        run: python3 tools/build_release.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # A release made on GitHub's release page already exists: add the files to it.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/web-guide.docx --clobber
          else
            gh release create "$TAG" dist/*.zip dist/web-guide.docx --title "$TAG" --generate-notes
          fi
